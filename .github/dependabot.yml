version: 2

# Updates target master (the default branch). Minor and patch updates are
# grouped per component; each major update gets its own PR so a breaking
# upgrade (framework, ORM, SDK) can be evaluated and migrated on its own
# instead of blocking every safe bump in the same group.

updates:
  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Rome
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /workers/qvac-service
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    groups:
      qvac-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Legacy parser manifest retained for the standalone worker prototype.
  - package-ecosystem: pip
    directory: /workers
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Rome
    groups:
      parser-worker-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
