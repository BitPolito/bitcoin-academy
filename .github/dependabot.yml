version: 2

# Version updates are deliberately quiet: once a month, minor and patch only,
# grouped per dependency tree, with at most one open PR per tree. Major
# upgrades are planned and migrated by hand (#224 frontend, #225 backend).
# Security updates are separate (repository settings): vulnerability alerts and
# fix PRs keep covering every tree, including the legacy workers/ manifest.

updates:
  - package-ecosystem: pip
    directory: /services/ai
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # SQLAlchemy 2.1 is a minor release but switches the default Postgres
      # driver to psycopg 3; migrate it in #225.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /workers/qvac-service
    schedule:
      interval: monthly
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 1
    groups:
      qvac-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x minors can break, unit tests mock the SDK, and the lean worker
      # (src/worker.slim.js) imports SDK entry points: upgrade by hand, with a
      # live check.
      - dependency-name: "@qvac/sdk"
