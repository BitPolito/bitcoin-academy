# Production-ready base configuration.
# Development overrides (source mounts, exposed ports, hot reload) live in
# docker-compose.override.yml, which Docker Compose merges automatically.
# To run production-only: docker compose -f docker-compose.yml up

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitcoin_academy
      POSTGRES_PASSWORD: bitcoin_academy
      POSTGRES_DB: bitcoin_academy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitcoin_academy"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  qvac:
    build: ./workers/qvac-service
    restart: unless-stopped
    volumes:
      - qvac_data:/app/hyperdb
      - qvac_ingest:/qvac_ingest
    environment:
      - QVAC_PORT=3001
      - QVAC_INGEST_DIR=/qvac_ingest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '4'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  api:
    build:
      context: ./services/ai
    restart: unless-stopped
    volumes:
      - qvac_ingest:/qvac_ingest
    env_file:
      - ./services/ai/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=http://localhost:3000
      - QVAC_SERVICE_URL=http://qvac:3001
      - QVAC_INGEST_DIR=/qvac_ingest
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qvac:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2'

  arq-worker:
    build:
      context: ./services/ai
    command: arq app.workers.arq_worker.WorkerSettings
    restart: unless-stopped
    volumes:
      - qvac_ingest:/qvac_ingest
    env_file:
      - ./services/ai/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - QVAC_SERVICE_URL=http://qvac:3001
      - QVAC_INGEST_DIR=/qvac_ingest
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      qvac:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h redis -p 6379 ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2'

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
      - API_BASE_URL=http://api:8000/api
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.5'

volumes:
  postgres_data:
  qvac_data:
  qvac_ingest:
  redis_data:
  caddy_data:
  caddy_config:
