[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "bitcoin-academy-ai"
version = "0.1.0"
description = "AI-Tutor for Bitcoin Academy platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "BitPolito", email = "info@bitpolito.it"}
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "python-dotenv>=1.2.2",
    # Validation & settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Auth & security
    "python-jose==3.4.0",
    "passlib==1.7.4",
    "bcrypt==4.1.1",
    "zxcvbn==4.4.28",
    "bleach>=6.1.0",
    "slowapi==0.1.9",
    # HTTP client
    "httpx>=0.27.0",
    # RAG — document ingestion and vector search
    "PyMuPDF>=1.24.0",
    "python-pptx>=0.6.23",
    "fastembed>=0.2.6",
    "chromadb>=1.0.0",
    # LLM generation
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/BitPolito/bitcoin-academy"
Repository = "https://github.com/BitPolito/bitcoin-academy.git"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

[tool.pylint]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

# Configuration files are stored in config/ directory
# See config/pytest.ini, config/mypy.ini, config/setup.cfg
